[package]
name = "bazel-cache-server"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["desktop-gpui"]
default-members = ["."]
resolver = "3"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8"
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
hex = "0.4.3"
directories = "6"
serde_json = "1.0.151"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
local-ip-address = "0.6"
prometheus = "0.14.0"
prost = "0.14"
prost-types = "0.14"
r2d2 = "0.8.10"
r2d2_sqlite = "0.35.0"
rand = "0.10.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "http2", "charset"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "logging", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
toml = "1.1.6"
tonic = { version = "0.14", features = ["tls-ring", "router", "server", "transport"] }
tonic-health = "0.14"
tonic-prost = "0.14"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
x509-parser = "0.18.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[build-dependencies]
tonic-prost-build = "0.14"
